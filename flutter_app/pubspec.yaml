name: pacesync_marathon
description: High-accuracy real-time friend GPS tracker with battery & data optimization, host course navigation, and audio cheer alerts for marathon runners.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # High Accuracy GPS & Background Services
  geolocator: ^13.0.1
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2
  wakelock_plus: ^1.2.8
  battery_plus: ^6.1.0

  # Map & Speech Synthesis
  google_maps_flutter: ^2.10.0
  flutter_tts: ^4.1.0

  # Cloud Sync & State
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

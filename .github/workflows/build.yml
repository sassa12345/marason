name: Build APK and IPA

on:
  push:
    branches: [ "main" ]

jobs:
  # ----------------------------------------
  # Android用 APKのビルド
  # ----------------------------------------
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        # 👑 working-directory でフォルダを指定します
        working-directory: ./your-app-folder-name
        run: flutter pub get
        
      - name: Build APK
        working-directory: ./your-app-folder-name
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # 👑 出力されるパスもフォルダ名を含める必要があります
          path: your-app-folder-name/build/app/outputs/flutter-apk/app-release.apk

  # ----------------------------------------
  # iOS用 IPAのビルド
  # ----------------------------------------
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        working-directory: ./your-app-folder-name
        run: flutter pub get
        
      - name: Build IPA
        working-directory: ./your-app-folder-name
        run: flutter build ipa --no-codesign
        
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: your-app-folder-name/build/ios/archive/Runner.xcarchive
